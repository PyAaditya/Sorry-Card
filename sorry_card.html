<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Tiny Sorry Just for You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #ffd7e6;
    --pink-deep: #ff9dbf;
    --lavender: #e6d9f7;
    --lavender-deep: #c9a9ec;
    --cream: #fff7ed;
    --blue: #d7ecf9;
    --blue-deep: #a8d8ef;
    --plum: #6b4a63;
    --plum-soft: #9a7590;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 20% 10%, #fdeef7 0%, #f4e9fb 35%, #eaf3fb 70%, #fdf3ec 100%);
    font-family:'Quicksand', sans-serif;
    padding: 30px 14px;
  }

  .card{
    position:relative;
    width: 430px;
    max-width:100%;
    border-radius: 34px;
    background: linear-gradient(160deg, var(--cream) 0%, #fff 40%, var(--pink) 100%);
    box-shadow:
      0 30px 60px -20px rgba(180, 130, 170, 0.35),
      0 8px 20px -6px rgba(180,130,170,0.25),
      inset 0 0 0 1px rgba(255,255,255,0.6);
    overflow:hidden;
    padding: 30px 26px 26px;
  }

  /* soft blobs */
  .blob{
    position:absolute;
    border-radius:50%;
    opacity:0.55;
    z-index:0;
  }
  .blob.b1{ width:180px; height:180px; background: radial-gradient(circle, var(--blue) 0%, transparent 70%); top:-60px; left:-60px; }
  .blob.b2{ width:220px; height:220px; background: radial-gradient(circle, var(--lavender) 0%, transparent 70%); bottom:-80px; right:-70px; }
  .blob.b3{ width:140px; height:140px; background: radial-gradient(circle, var(--pink) 0%, transparent 70%); top:40%; right:-50px; }

  .content{ position:relative; z-index:2; }

  .header{
    text-align:center;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 34px;
    color: var(--plum);
    line-height:1.15;
    margin: 4px 0 2px;
    text-shadow: 0 2px 0 rgba(255,255,255,0.7);
  }

  .subtag{
    text-align:center;
    font-size:12.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: var(--plum-soft);
    font-weight:600;
    margin-bottom: 14px;
  }

  .stage{
    position:relative;
    height: 300px;
    border-radius: 24px;
    background: linear-gradient(180deg, var(--blue) 0%, #eef7fb 55%, var(--pink) 100%);
    overflow:hidden;
    box-shadow: inset 0 2px 10px rgba(255,255,255,0.6), inset 0 -2px 14px rgba(160,130,170,0.15);
    margin-bottom: 18px;
  }

  /* clouds */
  .cloud{
    position:absolute;
    background:#ffffff;
    border-radius:50px;
    opacity:0.9;
  }
  .cloud:before, .cloud:after{
    content:"";
    position:absolute;
    background:#ffffff;
    border-radius:50%;
  }
  .cloud1{ width:56px; height:20px; top:16px; left:18px; }
  .cloud1:before{ width:26px; height:26px; top:-13px; left:6px; }
  .cloud1:after{ width:20px; height:20px; top:-9px; left:28px; }

  .cloud2{ width:70px; height:22px; top:34px; right:14px; opacity:0.85;}
  .cloud2:before{ width:30px; height:30px; top:-15px; left:8px; }
  .cloud2:after{ width:22px; height:22px; top:-10px; left:34px; }

  /* ground */
  .ground{
    position:absolute;
    bottom:0; left:0; right:0;
    height: 60px;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255, 214, 232, 0.7) 100%);
  }

  /* sparkles & doodles */
  .sparkle{ position:absolute; color: var(--pink-deep); font-size:16px; opacity:0.9; }
  .heart-doodle{ position:absolute; color: var(--pink-deep); font-size:14px; opacity:0.75; }
  .flower-doodle{ position:absolute; font-size:16px; opacity:0.85; }

  /* SVG characters */
  .girl, .boy{ position:absolute; bottom: 46px; }
  .girl{ left: 24px; width:118px; }
  .boy{ right: 14px; width:128px; }

  /* speech bubble */
  .bubble{
    position:absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 268px;
    background: #ffffff;
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 11.5px;
    line-height:1.45;
    color: var(--plum);
    text-align:center;
    font-weight:600;
    box-shadow: 0 8px 18px -6px rgba(150,110,140,0.35);
  }
  .bubble:after{
    content:"";
    position:absolute;
    bottom:-9px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:10px solid #ffffff;
  }

  .placard{
    position:absolute;
    top: -34px;
    left: 50%;
    transform: translateX(-50%) rotate(-6deg);
    background: #fff;
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 9.5px;
    font-weight:700;
    color: var(--plum);
    box-shadow: 0 4px 10px rgba(150,110,140,0.3);
    white-space:nowrap;
  }

  .footer-msg{
    text-align:center;
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size: 24px;
    color: var(--plum);
    margin-top: 6px;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin: 4px 0 10px;
    opacity:0.6;
  }
  .divider span{ font-size:10px; }
  .divider .line{
    height:1px;
    width:38px;
    background: linear-gradient(90deg, transparent, var(--pink-deep), transparent);
  }

  .bottom-row{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top: 10px;
    font-size: 18px;
  }

  .buttons-wrap{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin-top: 18px;
    height: 60px;
  }

  .btn{
    border:none;
    border-radius: 999px;
    padding: 12px 22px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 13.5px;
    cursor:pointer;
    box-shadow: 0 8px 18px -6px rgba(150,110,140,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:active{ transform: scale(0.96); }

  .btn-yes{
    background: linear-gradient(135deg, var(--pink-deep), var(--lavender-deep));
    color: #fff;
  }
  .btn-yes:hover{ transform: translateY(-2px); box-shadow: 0 12px 22px -6px rgba(150,110,140,0.5); }
  .btn-yes.grown{ transform: scale(1.12); }

  .btn-no{
    background: linear-gradient(135deg, var(--pink-deep), var(--lavender-deep));
    color: #fff;
    border: none;
  }
  .btn-no.dodging{
    position:absolute;
    transition: left 0.28s ease, top 0.28s ease;
    z-index: 10;
  }

  .result-msg{
    text-align:center;
    min-height: 26px;
    margin-top: 10px;
    opacity:0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    transform: translateY(6px);
  }
  .result-msg.show{ opacity:1; transform: translateY(0); }
  .result-title{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 26px;
    color: var(--plum);
    line-height:1.2;
  }
  .result-sub{
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size: 12px;
    color: var(--plum-soft);
    margin-top: 4px;
  }
  .result-emojis{
    margin-top: 8px;
    font-size: 16px;
    letter-spacing: 4px;
  }

  .plea-msg{
    text-align:center;
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size: 18px;
    color: var(--pink-deep);
    min-height: 22px;
    margin-top: 12px;
    opacity:0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    transform: translateY(4px);
  }
  .plea-msg.show{ opacity:1; transform: translateY(0); }
  .footer-credit{
    text-align:center;
    margin-top: 14px;
    font-size: 9px;
    letter-spacing: 0.03em;
    color: var(--plum-soft);
    opacity:0.6;
  }
  .footer-credit a{
    color: var(--plum-soft);
    text-decoration: none;
    font-weight:600;
  }
  .footer-credit a:hover{
    text-decoration: underline;
    opacity:1;
  }
</style>
</head>
<body>

<div class="card">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="content">
    <div class="header">A Tiny Sorry Just for You 💗</div>
    <div class="subtag">handmade with guilt &amp; glitter</div>

    <div class="stage">
      <!-- clouds -->
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>

      <!-- doodles -->
      <div class="sparkle" style="top:14px; left:120px;">✦</div>
      <div class="sparkle" style="top:70px; left:190px; font-size:12px;">✦</div>
      <div class="sparkle" style="top:100px; left:12px; font-size:12px;">✧</div>
      <div class="heart-doodle" style="top:120px; left:150px;">🩷</div>
      <div class="heart-doodle" style="top:60px; left:60px; font-size:11px;">💕</div>
      <div class="flower-doodle" style="top:150px; left:18px;">🌸</div>
      <div class="flower-doodle" style="top:180px; left:210px; font-size:13px;">🌷</div>
      <div class="sparkle" style="bottom:70px; right:20px; font-size:13px;">✦</div>

      <!-- cute cat doodle -->
      <svg class="cat" style="position:absolute; top:14px; left:12px; width:34px;" viewBox="0 0 40 34">
        <path d="M8 14 C6 6 12 2 16 8 C18 4 22 4 24 8 C28 2 34 6 32 14 C34 20 30 26 20 26 C10 26 6 20 8 14Z" fill="#fff" stroke="#e9b8cf" stroke-width="1.2"/>
        <circle cx="15" cy="15" r="1.4" fill="#6b4a63"/>
        <circle cx="25" cy="15" r="1.4" fill="#6b4a63"/>
        <path d="M18 19 Q20 21 22 19" fill="none" stroke="#e78fae" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M12 16 L6 15 M12 18 L6 19" stroke="#d9a9c0" stroke-width="0.8"/>
        <path d="M28 16 L34 15 M28 18 L34 19" stroke="#d9a9c0" stroke-width="0.8"/>
      </svg>

      <!-- teddy doodle -->
      <svg class="teddy" style="position:absolute; top:150px; left:190px; width:30px;" viewBox="0 0 40 40">
        <circle cx="10" cy="8" r="5" fill="#f7ddb5"/>
        <circle cx="30" cy="8" r="5" fill="#f7ddb5"/>
        <circle cx="20" cy="20" r="14" fill="#f2c98e"/>
        <circle cx="15" cy="18" r="1.5" fill="#6b4a63"/>
        <circle cx="25" cy="18" r="1.5" fill="#6b4a63"/>
        <ellipse cx="20" cy="24" rx="4" ry="3" fill="#fff3e0"/>
        <path d="M18 25 Q20 27 22 25" fill="none" stroke="#a97c4f" stroke-width="1"/>
      </svg>

      <!-- ground -->
      <div class="ground"></div>

      <!-- GIRL -->
      <svg class="girl" viewBox="0 0 140 190" xmlns="http://www.w3.org/2000/svg">
        <!-- hair back -->
        <ellipse cx="70" cy="70" rx="46" ry="50" fill="#5a3a2e"/>
        <!-- body / kurta -->
        <path d="M30 120 Q70 100 110 120 L118 190 L22 190 Z" fill="#ffb8d3"/>
        <path d="M30 120 Q70 100 110 120 L114 140 Q70 118 26 140 Z" fill="#ff9dc0"/>
        <!-- dupatta accent -->
        <path d="M40 118 Q70 132 100 118 L96 190 L44 190 Z" fill="#fddce9" opacity="0.6"/>
        <!-- neck -->
        <rect x="60" y="95" width="20" height="20" rx="8" fill="#f3c9a7"/>
        <!-- face -->
        <circle cx="70" cy="72" r="40" fill="#f6d0ac"/>
        <!-- hair front / bangs -->
        <path d="M30 62 Q35 20 70 22 Q105 20 110 62 Q108 40 70 38 Q32 40 30 62Z" fill="#5a3a2e"/>
        <!-- side buns -->
        <circle cx="24" cy="58" r="13" fill="#5a3a2e"/>
        <circle cx="116" cy="58" r="13" fill="#5a3a2e"/>
        <!-- bindi -->
        <circle cx="70" cy="58" r="2.4" fill="#e05780"/>
        <!-- eyebrows (slightly worried) -->
        <path d="M48 60 Q56 55 64 59" stroke="#5a3a2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M76 59 Q84 55 92 60" stroke="#5a3a2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <!-- big eyes -->
        <ellipse cx="56" cy="70" rx="8" ry="10" fill="#fff"/>
        <ellipse cx="84" cy="70" rx="8" ry="10" fill="#fff"/>
        <circle cx="57" cy="72" r="5.4" fill="#4a2e22"/>
        <circle cx="85" cy="72" r="5.4" fill="#4a2e22"/>
        <circle cx="59" cy="69" r="1.6" fill="#fff"/>
        <circle cx="87" cy="69" r="1.6" fill="#fff"/>
        <!-- lashes -->
        <path d="M48 64 L45 61" stroke="#4a2e22" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M92 64 L95 61" stroke="#4a2e22" stroke-width="1.4" stroke-linecap="round"/>
        <!-- blush -->
        <ellipse cx="48" cy="84" rx="6" ry="4" fill="#ff9fb8" opacity="0.6"/>
        <ellipse cx="92" cy="84" rx="6" ry="4" fill="#ff9fb8" opacity="0.6"/>
        <!-- pouty mouth -->
        <path d="M63 92 Q70 88 77 92 Q70 98 63 92Z" fill="#e05780"/>
        <!-- earrings -->
        <circle cx="30" cy="80" r="2.2" fill="#ffd76a"/>
        <circle cx="110" cy="80" r="2.2" fill="#ffd76a"/>
        <!-- arms crossed / hands near face slightly -->
        <path d="M30 130 Q20 145 30 160" stroke="#f6d0ac" stroke-width="12" fill="none" stroke-linecap="round"/>
        <path d="M110 130 Q120 145 110 160" stroke="#f6d0ac" stroke-width="12" fill="none" stroke-linecap="round"/>
      </svg>

      <!-- BOY -->
      <svg class="boy" viewBox="0 0 150 190" xmlns="http://www.w3.org/2000/svg">
        <!-- placard on a little stick -->
        <rect x="93" y="18" width="2.4" height="34" fill="#c9a9ec"/>
        <g>
          <rect x="58" y="4" width="70" height="26" rx="6" fill="#ffffff" stroke="#e6c9dc" stroke-width="1.5" transform="rotate(-4 93 17)"/>
          <text x="93" y="21" transform="rotate(-4 93 17)" text-anchor="middle" font-family="Quicksand, sans-serif" font-size="10" font-weight="700" fill="#6b4a63">I'm Sorry 🥺</text>
        </g>

        <!-- body / kurta -->
        <path d="M35 118 Q75 100 115 118 L122 190 L28 190 Z" fill="#cfeaf7"/>
        <path d="M35 118 Q75 100 115 118 L112 132 Q75 116 38 132 Z" fill="#a8d8ef"/>

        <!-- neck -->
        <rect x="66" y="96" width="18" height="18" rx="7" fill="#e3ac82"/>

        <!-- face -->
        <circle cx="75" cy="74" r="38" fill="#e9b98c"/>

        <!-- messy hair -->
        <path d="M38 68 Q34 30 75 30 Q116 30 112 68 Q108 42 75 42 Q42 42 38 68Z" fill="#3b2a22"/>
        <path d="M60 34 Q66 24 74 30" stroke="#3b2a22" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M84 30 Q92 24 96 34" stroke="#3b2a22" stroke-width="4" fill="none" stroke-linecap="round"/>

        <!-- eyebrows apologetic -->
        <path d="M54 62 Q62 66 68 62" stroke="#3b2a22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M82 62 Q88 66 96 62" stroke="#3b2a22" stroke-width="2.2" fill="none" stroke-linecap="round"/>

        <!-- eyes (round, pleading, slightly teary) -->
        <circle cx="62" cy="72" r="7" fill="#fff"/>
        <circle cx="88" cy="72" r="7" fill="#fff"/>
        <circle cx="63" cy="74" r="4.6" fill="#3b2a22"/>
        <circle cx="89" cy="74" r="4.6" fill="#3b2a22"/>
        <circle cx="64.5" cy="71.5" r="1.3" fill="#fff"/>
        <circle cx="90.5" cy="71.5" r="1.3" fill="#fff"/>
        <!-- little tear -->
        <path d="M60 80 Q58 85 60 88 Q62 85 60 80Z" fill="#a8d8ef"/>

        <!-- blush -->
        <ellipse cx="54" cy="86" rx="5" ry="3.4" fill="#ffb6a3" opacity="0.6"/>
        <ellipse cx="96" cy="86" rx="5" ry="3.4" fill="#ffb6a3" opacity="0.6"/>

        <!-- small worried smile -->
        <path d="M68 92 Q75 96 82 92" stroke="#8a4a2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>

        <!-- arm holding bouquet -->
        <path d="M40 130 Q28 140 32 158" stroke="#e9b98c" stroke-width="12" fill="none" stroke-linecap="round"/>
        <!-- bouquet -->
        <g transform="translate(14,148)">
          <path d="M8 30 L14 8" stroke="#7bb37a" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="8" cy="4" r="6" fill="#ffb8d3"/>
          <circle cx="0" cy="8" r="5" fill="#ffd7e6"/>
          <circle cx="16" cy="8" r="5" fill="#e6d9f7"/>
          <circle cx="8" cy="12" r="4" fill="#fff3e0"/>
          <path d="M4 22 L8 30 L12 22Z" fill="#ffd7e6"/>
        </g>

        <!-- other arm relaxed -->
        <path d="M112 130 Q124 142 118 160" stroke="#e9b98c" stroke-width="12" fill="none" stroke-linecap="round"/>
      </svg>

      <!-- speech bubble -->
      <div class="bubble">
        Please don't stay angry... meri last 2 brain cells bhi guilt se ro rahi hain 😭👉👈
      </div>
    </div>

    <div class="divider"><div class="line"></div><span>🌸</span><div class="line"></div></div>

    <div class="footer-msg">Can we be okay again? 🌸</div>

    <div class="bottom-row">
      <span>🎀</span><span>🩷</span><span>☁️</span><span>✨</span><span>🐱</span>
    </div>

    <div class="buttons-wrap" id="initialWrap" style="height:auto;">
      <button class="btn btn-yes" id="maafBtn">Maaf krdo 🥺</button>
    </div>

    <div class="buttons-wrap" id="buttonsWrap" style="display:none;">
      <button class="btn btn-yes" id="yesBtn">Haan 💗</button>
      <button class="btn btn-no" id="noBtn">Nahi</button>
    </div>

    <div class="plea-msg" id="pleaMsg"></div>

    <div class="result-msg" id="resultMsg"></div>

    <div class="footer-credit"><a href="https://www.instagram.com/aadityv._" target="_blank" rel="noopener noreferrer">Contact owner</a></div>
  </div>
</div>

<script>
  const initialWrap = document.getElementById('initialWrap');
  const maafBtn = document.getElementById('maafBtn');
  const wrap = document.getElementById('buttonsWrap');
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const resultMsg = document.getElementById('resultMsg');

  const pleaMsg = document.getElementById('pleaMsg');

  const card = document.querySelector('.card');

  const pleaLines = [
    "Please na, ek chance de do 🥺",
    "Sorry bola tha na... 🥹💗",
    "Itna gussa acha nahi lagta 🙏",
    "Pleaseee, dil se sorry hai 😭",
    "Ek baar maaf kr do na 🌸",
    "Mai wait kr rha hu, please 💗",
    "Bas ek 'haan' ki dhoondh hai 🥺👉👈",
    "Maaf kr do please, promise no repeat 🙈"
  ];

  let attempt = 0;

  maafBtn.addEventListener('click', function(){
    initialWrap.style.display = 'none';
    wrap.style.display = 'flex';
  });

  function dodge(){
    if (!noBtn.classList.contains('dodging')) {
      const btnRect = noBtn.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();
      noBtn.style.left = (btnRect.left - cardRect.left) + 'px';
      noBtn.style.top = (btnRect.top - cardRect.top) + 'px';
      card.appendChild(noBtn);
      noBtn.classList.add('dodging');
      void noBtn.offsetWidth;
    }

    const cardRect = card.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const maxX = Math.max(8, cardRect.width - btnRect.width - 16);
    const maxY = Math.max(8, cardRect.height - btnRect.height - 16);
    const randX = 8 + Math.random() * maxX;
    const randY = 8 + Math.random() * maxY;
    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';

    yesBtn.classList.add('grown');

    pleaMsg.textContent = pleaLines[attempt % pleaLines.length];
    pleaMsg.classList.remove('show');
    void pleaMsg.offsetWidth;
    pleaMsg.classList.add('show');
    attempt++;
  }

  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); dodge(); }, {passive:false});
  noBtn.addEventListener('click', function(e){ e.preventDefault(); dodge(); });

  yesBtn.addEventListener('click', function(){
    wrap.style.display = 'none';
    if (noBtn.classList.contains('dodging')) noBtn.style.display = 'none';
    pleaMsg.classList.remove('show');
    resultMsg.innerHTML =
      '<div class="result-title">Yayy! Sab theek ho gaya 🥹💗</div>' +
      '<div class="result-sub">Thank you for forgiving me... promise, ab se aisa nahi hoga 🌸</div>' +
      '<div class="result-emojis">🎀 💗 🌸 ✨</div>';
    resultMsg.classList.add('show');
  });
</script>

</body>
</html>
